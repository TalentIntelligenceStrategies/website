<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff;font:11px/1.55 monospace}#out{padding:8px;white-space:pre}
iframe{position:absolute;left:-9999px;height:1400px;border:0}</style></head>
<body><pre id="out">…</pre>
<script>
const W=[881,900,1024,1280,1440,1600,1920];
const out=document.getElementById('out');const rows=[];
const load=(src,w)=>new Promise(r=>{const f=document.createElement('iframe');
  f.style.width=w+'px';f.src=src;document.body.appendChild(f);
  f.addEventListener('load',()=>setTimeout(()=>r(f),450));});
const lines=(f,i)=>{const d=f.contentDocument;
  const e=[...d.querySelectorAll('.contact-overlay-meta .contact-meta')][i];
  const dd=e.querySelector('dd');const lh=parseFloat(f.contentWindow.getComputedStyle(dd).lineHeight)||21;
  return Math.round(dd.getBoundingClientRect().height/lh);};
(async()=>{
 rows.push('width   EN:hours addr email/ubn |  ZH:hours addr  |  ubnX-emailX  overflow');
 for(const w of W){
  const a=await load('/.mp.html',w), b=await load('/.mp.html?lang=zh',w);
  const d=a.contentDocument;
  const items=[...d.querySelectorAll('.contact-overlay-meta .contact-meta')];
  const emailX=Math.round(items[2].getBoundingClientRect().left);
  const ubnX=Math.round(items[3].getBoundingClientRect().left);
  const ov=d.querySelector('.contact-overlay');
  const meta=d.querySelector('.contact-overlay-meta');
  const overflow = meta.getBoundingClientRect().right > ov.getBoundingClientRect().right - 1;
  rows.push(String(w).padEnd(8)+String(lines(a,0)).padEnd(9)+String(lines(a,1)).padEnd(5)
    +String(lines(a,2)).padEnd(11)+String(lines(b,0)).padEnd(9)+String(lines(b,1)).padEnd(8)
    +(ubnX-emailX+'px').padEnd(14)+overflow);
  a.remove();b.remove();out.textContent=rows.join('\n');
 }
 rows.push('\nhours/addr = line count of the value. 1 = one line.');
 out.textContent=rows.join('\n');
})();
</script></body></html>
