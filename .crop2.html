<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}
iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0}</style></head>
<body><iframe id="f"></iframe>
<script>
const f=document.getElementById('f');
f.src='/product/signal/'+location.search;
f.addEventListener('load',()=>setTimeout(()=>{
  const d=f.contentDocument;
  const card=d.querySelector('.contact-card--sig-intake');
  const y=card.getBoundingClientRect().top + f.contentWindow.scrollY;
  f.contentWindow.scrollTo(0, y - 20);
},600));
</script></body></html>
