<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8" /><link rel="stylesheet" href="/assets/styles.css" />
<style>.probe-chrome{position:absolute;left:-9999px;top:0}body{margin:0}</style>
<script>
  const q=new URLSearchParams(location.search);
  if(q.get('lang'))localStorage.setItem('tis-lang',q.get('lang'));else localStorage.removeItem('tis-lang');
  window.addEventListener('DOMContentLoaded',()=>{
    if(q.get('bg'))document.querySelectorAll('.contact-overlay-meta,.contact-overlay-top')
      .forEach(e=>e.querySelectorAll('*').forEach(c=>c.style.visibility='hidden'));
    const r=[...document.querySelectorAll('.contact-overlay-meta .contact-meta')];
    const info=r.map(e=>{const b=e.getBoundingClientRect();
      const dd=e.querySelector('dd'); const db=dd.getBoundingClientRect();
      const lines=Math.round(db.height/ (parseFloat(getComputedStyle(dd).lineHeight)||21));
      return [Math.round(b.left),Math.round(b.top),Math.round(b.right),Math.round(b.bottom),lines].join(',')});
    document.title='R|'+info.join('|');
    if(q.get('rects')){const d=document.createElement('div');d.textContent=document.title;
      d.style.cssText='position:fixed;left:0;bottom:0;font:11px monospace;background:#fff;color:#000;z-index:99';
      document.body.appendChild(d);}
  });
</script></head><body>
<div class="probe-chrome" aria-hidden="true"><div id="lang-wrap"><button id="lang-trigger"></button>
<button data-lang-set="en"></button><button data-lang-set="zh"></button></div><div id="lang-cube"></div></div>
<main>
<section class="contact" id="contact" aria-labelledby="contact-heading">
    <div class="container">
      <div class="contact-card contact-card--venture">

        <aside class="contact-overlay">
          <div class="contact-overlay-top">
            <h2 id="contact-heading" data-zh="與我們聯絡。">Get in touch.</h2>
            <p class="contact-lead" data-zh="從一件專利到整個專利組合，告訴我們您的需求。">From one patent to a whole portfolio, tell us what you need.</p>
          </div>
          <!-- DOM order IS the visual order, so the screen-reader pass matches the
               page: two full-width rows, then Email and the UBN paired on the last.
               Office hours and the address are single long strings that break badly in
               a half-width column, so each takes a row of its own (.contact-meta--wide).
               Email and the UBN are both short, so they share one.
               The address and UBN are published for payment-gateway verification — the
               site named neither a street address nor an entity number before this. The
               UBN is language-neutral digits, so only its <dt> carries data-zh. -->
          <dl class="contact-overlay-meta">
            <div class="contact-meta contact-meta--wide">
              <dt data-zh="服務時間">Office hours</dt>
              <dd data-zh="台北 (UTC+8) · 週一至週五 09:00–18:00">Taipei (UTC+8) · Mon–Fri 09:00–18:00</dd>
            </div>
            <div class="contact-meta contact-meta--wide">
              <dt data-zh="地址">Address</dt>
              <dd data-zh="100 台北市中正區青島東路4之8號">No. 4-8, Qingdao E. Rd., Zhongzheng Dist., Taipei City 100, Taiwan</dd>
            </div>
            <div class="contact-meta">
              <dt data-zh="電子郵件">Email</dt>
              <dd><a href="mailto:contact@tisglobalinc.com">contact@tisglobalinc.com</a></dd>
            </div>
            <div class="contact-meta">
              <dt data-zh="統一編號">UBN</dt>
              <dd class="contact-meta__num">60331107</dd>
            </div>
          </dl>
        </aside>

        <div class="contact-panel">
          <form class="contact-form" id="contact-form" novalidate>
            <div class="contact-row">
              <div class="field">
                <label for="contact-name" data-zh="姓名">Full Name</label>
                <input id="contact-name" name="name" type="text" autocomplete="name" placeholder="e.g. Alexander Chen" />
              </div>
              <div class="field">
                <label for="contact-title" data-zh="職稱">Job Title</label>
                <input id="contact-title" name="title" type="text" autocomplete="organization-title" placeholder="e.g. VP, Legal" />
              </div>
            </div>
            <div class="contact-row">
              <div class="field">
                <label for="contact-email" data-zh="電子郵件">Email Address</label>
                <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="name@company.com" />
              </div>
              <div class="field">
                <label for="contact-phone" data-zh="電話">Phone Number</label>
                <input id="contact-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+886 2 1234 5678" />
              </div>
            </div>
            <div class="field">
              <label for="contact-org" data-zh="機構">Organization</label>
              <input id="contact-org" name="org" type="text" autocomplete="organization" placeholder="Company" />
            </div>

            <!-- Inquiry type — chips (native radios). ZH per chinese-copy-direction.md slide 16;
                 EN labels streamlined (Miko 2026-07-18): Licensing / Evaluation / Reports / Owned Patents / Media / Other. -->
            <fieldset class="contact-topics">
              <legend data-zh="諮詢類型">Inquiry type</legend>
              <div class="topic-chips">
                <label class="topic-chip"><input type="radio" name="topic" value="licensing" /><span data-zh="專利授權">Licensing</span></label>
                <label class="topic-chip"><input type="radio" name="topic" value="evaluation" /><span data-zh="專利評估">Evaluation</span></label>
                <label class="topic-chip"><input type="radio" name="topic" value="reports" /><span data-zh="專利報告">Reports</span></label>
                <label class="topic-chip"><input type="radio" name="topic" value="owned" /><span data-zh="自有專利">Owned Patents</span></label>
                <label class="topic-chip"><input type="radio" name="topic" value="media" /><span data-zh="媒體採訪">Media</span></label>
                <label class="topic-chip"><input type="radio" name="topic" value="other" /><span data-zh="其他">Other</span></label>
              </div>
            </fieldset>

            <div class="field">
              <label for="contact-message" data-zh="您的需求">Your Inquiry</label>
              <textarea id="contact-message" name="message" rows="4" placeholder="Briefly describe your requirements…"></textarea>
            </div>
            <div class="contact-actions">
              <button type="submit" class="btn btn-primary btn-lg" data-zh="送出諮詢">Send Inquiry</button>
            </div>
          </form>

          <div class="contact-success" id="contact-success" role="status" aria-live="polite">
            <span class="check-pill" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
            </span>
            <div>
              <h3 data-zh="訊息已送出。">Message sent.</h3>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>
</main><script src="/assets/site.js" defer></script></body></html>
